/* ---------- Storage helpers (Supabase, tabela estoque_kv: key/value) ---------- */

async function safeGet(key, _shared) {
  if (!supabaseClient) throw new Error('Banco de dados nao configurado.');
  const {
    data,
    error
  } = await supabaseClient.from('estoque_kv').select('value').eq('key', key).maybeSingle();
  if (error) throw error;
  // null aqui significa: a chave realmente nao existe no banco.
  // Falha de rede NUNCA chega aqui como null - vira excecao acima.
  return data ? data.value : null;
}
async function safeSet(key, value, _shared) {
  if (!supabaseClient) return false;
  try {
    const {
      error
    } = await supabaseClient.from('estoque_kv').upsert({
      key,
      value,
      updated_at: new Date().toISOString()
    });
    if (error) {
      console.error('Falha ao salvar', key, error);
      return false;
    }
    return true;
  } catch (e) {
    console.error('Falha ao salvar', key, e);
    return false;
  }
}
function getPublicIp() {
  return Promise.race([fetch('https://api.ipify.org?format=json').then(r => r.json()).then(d => d.ip || null).catch(() => null), new Promise(resolve => setTimeout(() => resolve(null), 3500))]);
}

/* ---------- Produtos e movimentacoes: uma linha por registro ---------- */
/* O banco usa nomes com underline; o app usa camelCase. Estas quatro
   funcoes traduzem de um lado para o outro. */

function produtoDaLinha(r) {
  return {
    id: r.id,
    categoria: r.categoria,
    nomeItem: r.nome_item,
    descricao: r.descricao || '',
    quantidade: Number(r.quantidade),
    imagemUrl: r.imagem_url || null
  };
}
function produtoParaLinha(p) {
  return {
    id: p.id,
    categoria: p.categoria,
    nome_item: p.nomeItem,
    descricao: p.descricao || '',
    quantidade: p.quantidade,
    imagem_url: p.imagemUrl || null
  };
}
function movDaLinha(r) {
  return {
    id: r.id,
    produtoId: r.produto_id,
    produtoNome: r.produto_nome,
    categoria: r.categoria,
    tipo: r.tipo,
    quantidade: Number(r.quantidade),
    quantidadeAnterior: Number(r.quantidade_anterior),
    quantidadeNova: Number(r.quantidade_nova),
    data: r.data,
    obs: r.obs || '',
    ip: r.ip || 'Indisponível'
  };
}
const LIMITE_HISTORICO = 500;
async function lerProdutos() {
  if (!supabaseClient) throw new Error('Banco de dados nao configurado.');
  const {
    data,
    error
  } = await supabaseClient.from('produtos').select('*').order('nome_item');
  if (error) throw error;
  return (data || []).map(produtoDaLinha);
}
async function lerMovimentacoes() {
  if (!supabaseClient) throw new Error('Banco de dados nao configurado.');
  const {
    data,
    error
  } = await supabaseClient.from('movimentacoes').select('*').order('data', {
    ascending: false
  }).limit(LIMITE_HISTORICO);
  if (error) throw error;
  return (data || []).map(movDaLinha);
}
async function gravarProduto(produto) {
  const {
    error
  } = await supabaseClient.from('produtos').upsert(produtoParaLinha(produto));
  if (error) throw error;
}
async function excluirProduto(id) {
  const {
    error
  } = await supabaseClient.from('produtos').delete().eq('id', id);
  if (error) throw error;
}
/* A conta do estoque e feita dentro do banco, com trava na linha do
   produto. Duas vendas do mesmo item ao mesmo tempo entram em fila. */
async function gravarMovimentacao(args) {
  const {
    data,
    error
  } = await supabaseClient.rpc('registrar_movimentacao', {
    p_mov_id: args.id,
    p_produto_id: args.produtoId,
    p_tipo: args.tipo,
    p_quantidade: args.quantidade,
    p_obs: args.obs || '',
    p_ip: args.ip || 'Indisponível'
  });
  if (error) throw error;
  return data;
}

/* ---------- Sessao: mantem o login ao atualizar a pagina ---------- */
/* Fica salvo so no aparelho, por SESSAO_HORAS. Sair pelo botao limpa. */

const SESSAO_CHAVE = 'zagonel-sessao';
const SESSAO_HORAS = 12;
function lerSessao() {
  try {
    const bruto = window.localStorage.getItem(SESSAO_CHAVE);
    if (!bruto) return null;
    const s = JSON.parse(bruto);
    if (!s || (s.role !== 'gerente' && s.role !== 'visitante') || !s.expira) return null;
    if (Date.now() > s.expira) {
      window.localStorage.removeItem(SESSAO_CHAVE);
      return null;
    }
    return s.role;
  } catch (e) {
    return null; // navegador anonimo ou armazenamento bloqueado
  }
}
function gravarSessao(role) {
  try {
    window.localStorage.setItem(SESSAO_CHAVE, JSON.stringify({
      role,
      expira: Date.now() + SESSAO_HORAS * 3600 * 1000
    }));
  } catch (e) {/* sem armazenamento: cai no comportamento antigo */}
}
function limparSessao() {
  try {
    window.localStorage.removeItem(SESSAO_CHAVE);
  } catch (e) {}
}

function parseDim(nomeItem) {

  if (!m) return null;
  const w = parseFloat(m[1].replace(',', '.'));

  if (!w || !h) return null;
  return {
    w,

  };
}

}
