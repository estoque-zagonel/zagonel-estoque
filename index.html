/* ---------- Storage helpers (Supabase, tabela estoque_kv: key/value) ---------- */

async function safeGet(key, _shared) {
  if (!supabaseClient) return null;
  try {
    const { data, error } = await supabaseClient
      .from('estoque_kv')
      .select('value')
      .eq('key', key)
      .maybeSingle();
    if (error) { console.error('Falha ao ler', key, error); return null; }
    return data ? data.value : null;
  } catch (e) {
    console.error('Falha ao ler', key, e);
    return null;
  }
}

async function safeSet(key, value, _shared) {
  if (!supabaseClient) return false;
  try {
    const { error } = await supabaseClient
      .from('estoque_kv')
      .upsert({ key, value, updated_at: new Date().toISOString() });
    if (error) { console.error('Falha ao salvar', key, error); return false; }
    return true;
  } catch (e) {
    console.error('Falha ao salvar', key, e);
    return false;
  }
}

/* ---------- Small utils ---------- */

function parseDim(nomeItem) {
  if (!nomeItem) return null;
  const m = nomeItem.match(/(\d+(?:[.,]\d+)?)\s*[x×]\s*(\d+(?:[.,]\d+)?)/i);
  if (!m) return null;
  const w = parseFloat(m[1].replace(',', '.'));
  const h = parseFloat(m[2].replace(',', '.'));
  if (!w || !h) return null;
  return { w, h };
}

function swatchDims(nomeItem, box = 30) {
  const d = parseDim(nomeItem);
  if (!d) return { width: box * 0.55, height: box * 0.55 };
  const scale = box / Math.max(d.w, d.h);
  return {
    width: Math.max(7, Math.round(d.w * scale)),
    height: Math.max(7, Math.round(d.h * scale)),
  };
}

function fmtQtd(n) {
  return (Math.round(n * 100) / 100).toLocaleString('pt-BR', {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2,
  });
}

function fmtData(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleString('pt-BR', {
      day: '2-digit', month: '2-digit', year: 'numeric',
      hour: '2-digit', minute: '2-digit',
    });
  } catch (e) {
    return iso;
  }
}

function uid(prefix) {
  return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
}

    if (!senha.trim()) {

  const opcoes = useMemo(() => {
    if (produtoInicial) return [];
    const termo = busca.trim().toLowerCase();
    if (!termo) return [];
    return produtos
      .filter((p) =>
        p.nomeItem.toLowerCase().includes(termo) ||
        p.descricao.toLowerCase().includes(termo)

      .slice(0, 8);

                          <div style={{ flex: 1, minWidth: 0, textAlign: 'left' }}>
                            <div className="eb-produto-nome">{p.nomeItem}</div>
                            <div className="eb-produto-desc">{p.descricao || '—'} · {fmtQtd(p.quantidade)} {UNIDADE} em estoque</div>

                      ))}

function ConfigSenhas({ senhas, onAlterar }) {
  const [atual, setAtual] = useState('');
  const [novaGerente, setNovaGerente] = useState('');
  const [novaVisitante, setNovaVisitante] = useState('');
  const [msg, setMsg] = useState(null);

  const handleSalvar = () => {
    if (atual !== senhas.gerente) {
      setMsg({ type: 'error', text: 'Senha atual do gerente incorreta.' });
      return;
    }
    if (!novaGerente.trim() || !novaVisitante.trim()) {
      setMsg({ type: 'error', text: 'Preencha as duas novas senhas.' });
      return;
    }
    onAlterar({ gerente: novaGerente.trim(), visitante: novaVisitante.trim() });
    setAtual(''); setNovaGerente(''); setNovaVisitante('');
    setMsg({ type: 'ok', text: 'Senhas atualizadas.' });
  };

  return (
    <div className="eb-card">
      <h3 className="eb-card-title">Alterar senhas de acesso</h3>
      <div className="eb-field">
        <label className="eb-field-label">Senha atual do gerente</label>

          <input type="password" className="eb-input" value={novaGerente} onChange={(e) => setNovaGerente(e.target.value)} />

        <div className="eb-field">

  );
}

    async function init() {
      const [prodRaw, movRaw, senhasRaw] = await Promise.all([
        comLimite(safeGet(STORAGE_KEYS.produtos, true)),
        comLimite(safeGet(STORAGE_KEYS.movimentacoes, true)),
        comLimite(safeGet(STORAGE_KEYS.senhas, true)),
      ]);
      if (cancelled) return;

      if (prodRaw) {
        try { setProdutos(JSON.parse(prodRaw)); } catch (e) { /* keep default */ }
      } else {
        safeSet(STORAGE_KEYS.produtos, JSON.stringify(PRODUTOS_INICIAIS), true);
      }

      if (movRaw) {
        try { setMovimentacoes(JSON.parse(movRaw)); } catch (e) { /* keep default */ }
      }

      if (senhasRaw) {
        try { setSenhas(JSON.parse(senhasRaw)); } catch (e) { /* keep default */ }
      } else {
        safeSet(STORAGE_KEYS.senhas, JSON.stringify(SENHA_PADRAO), true);
      }

      setLoading(false);
    }
    init();
    return () => { cancelled = true; };
  }, []);

  // Sincronização em tempo real entre aparelhos (Supabase Realtime)
  useEffect(() => {
    if (!supabaseClient) return;
    const channel = supabaseClient
      .channel('estoque-sync')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'estoque_kv' }, (payload) => {
        const row = payload.new || payload.old;
        if (!row || !row.key) return;
        try {
          if (row.key === STORAGE_KEYS.produtos) setProdutos(JSON.parse(row.value));
          else if (row.key === STORAGE_KEYS.movimentacoes) setMovimentacoes(JSON.parse(row.value));
          else if (row.key === STORAGE_KEYS.senhas) setSenhas(JSON.parse(row.value));
        } catch (e) { /* ignore malformed payload */ }
      })
      .subscribe();
    return () => { supabaseClient.removeChannel(channel); };
  }, []);

  const showToast = (msg, type = 'ok') => {
    setToast({ msg, type });
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 3200);
  };

  const handleLogin = (senha) => {
    if (senha === senhas.gerente) { setRole('gerente'); return true; }
    if (senha === senhas.visitante) { setRole('visitante'); return true; }
    return false;
  };

  const handleLogout = () => {
    setRole(null);
    setTab('estoque');
  };

  const persistProdutos = async (novos) => {
    setProdutos(novos);
    await safeSet(STORAGE_KEYS.produtos, JSON.stringify(novos), true);
  };

  const persistMovimentacoes = async (novas) => {
    setMovimentacoes(novas);
    await safeSet(STORAGE_KEYS.movimentacoes, JSON.stringify(novas), true);
  };

  const handleConfirmMovimentacao = async ({ produto, tipo, quantidade, obs }) => {
    const anterior = produto.quantidade;
    const nova = tipo === 'entrada' ? anterior + quantidade : anterior - quantidade;
    const novosProdutos = produtos.map((p) => p.id === produto.id ? { ...p, quantidade: Math.round(nova * 100) / 100 } : p);
    const registro = {
      id: uid('MV'),
      produtoId: produto.id,
      produtoNome: produto.nomeItem,
      categoria: produto.categoria,
      tipo,
      quantidade,
      quantidadeAnterior: anterior,
      quantidadeNova: Math.round(nova * 100) / 100,
      data: new Date().toISOString(),
      obs,
    };
    await persistProdutos(novosProdutos);
    await persistMovimentacoes([registro, ...movimentacoes]);
    setModalMov(null);
    showToast(`${tipo === 'entrada' ? 'Entrada' : 'Saída'} registrada: ${fmtQtd(quantidade)} ${UNIDADE} — ${produto.nomeItem}`);
  };

  const handleSaveProduto = async (produto) => {
    const existe = produtos.some((p) => p.id === produto.id);
    const novos = existe
      ? produtos.map((p) => p.id === produto.id ? produto : p)
      : [produto, ...produtos];
    await persistProdutos(novos);
    setModalProduto(null);
    showToast(existe ? 'Produto atualizado.' : 'Produto adicionado ao catálogo.');
  };

  const handleDeleteProduto = async (id) => {
    await persistProdutos(produtos.filter((p) => p.id !== id));
    setModalProduto(null);
    showToast('Produto removido do catálogo.');
  };

  const handleAlterarSenhas = async (novas) => {
    setSenhas(novas);
    await safeSet(STORAGE_KEYS.senhas, JSON.stringify(novas), true);
    showToast('Senhas atualizadas com sucesso.');
  };

  const isGerente = role === 'gerente';

  const produtosFiltrados = useMemo(() => {
    const termo = busca.trim().toLowerCase();
    return produtos
      .filter((p) => filtroCategoria === 'Todos' || p.categoria === filtroCategoria)
      .filter((p) => !somenteBaixo || p.quantidade < LIMITE_ESTOQUE_BAIXO)
      .filter((p) => !termo || p.nomeItem.toLowerCase().includes(termo) || p.descricao.toLowerCase().includes(termo))
      .sort((a, b) => a.nomeItem.localeCompare(b.nomeItem, 'pt-BR'));
  }, [produtos, filtroCategoria, busca, somenteBaixo]);

  const totais = useMemo(() => {
    const porCategoria = {};
    CATEGORIAS.forEach((c) => { porCategoria[c] = 0; });
    let geral = 0;
    let baixoEstoque = 0;
    produtos.forEach((p) => {
      porCategoria[p.categoria] = (porCategoria[p.categoria] || 0) + p.quantidade;
      geral += p.quantidade;
      if (p.quantidade < LIMITE_ESTOQUE_BAIXO) baixoEstoque += 1;
    });
    return { porCategoria, geral, baixoEstoque };
  }, [produtos]);

  if (!SUPABASE_CONFIGURADO) {
    return (
      <>
        <GlobalStyle />
        <div className="eb-login-wrap">
          <div className="eb-login-card" style={{ textAlign: 'left' }}>
            <div style={{ textAlign: 'center' }}><LogoMark size="lg" /></div>
            <h1 className="eb-login-title" style={{ textAlign: 'center' }}>Configuração pendente</h1>
            <p className="eb-login-sub" style={{ textAlign: 'center' }}>
              Este app ainda não está conectado ao banco de dados.
            </p>
            <p style={{ fontSize: 13, color: '#565A61', lineHeight: 1.6 }}>
              Abra este arquivo <code>index.html</code> em um editor de texto e preencha
              <code> SUPABASE_URL </code> e <code> SUPABASE_ANON_KEY </code> logo no início do
              código, com os dados do seu projeto Supabase (Project Settings → API).
              Depois salve e publique de novo.
            </p>
          </div>
        </div>
      </>
    );
  }

  if (!role) {
    return (
      <>
        <GlobalStyle />
        <LoginScreen onLogin={handleLogin} loading={loading} />
      </>
    );
  }

  return (
    <div className="eb-root">
      <GlobalStyle />

      <header className="eb-header eb-no-print">
        <div className="eb-header-left">
          <LogoMark size="sm" />
          <div className="eb-header-text">
            <span className="eb-header-title">{LOJA_NOME}</span>
            <span className="eb-header-subtitle">{LOJA_SUBTITULO_HEADER}</span>
          </div>
        </div>
        <div className="eb-header-right">
          <span className={`eb-role-pill ${isGerente ? 'eb-role-gerente' : 'eb-role-visitante'}`}>
            {isGerente ? 'Gerente' : 'Visitante'}
          </span>
          <button className="eb-icon-btn eb-icon-btn-light" onClick={handleLogout} aria-label="Sair">
            <LogOut size={17} />
          </button>
        </div>
      </header>

      <nav className="eb-tabs eb-no-print">
        <button className={`eb-tab ${tab === 'estoque' ? 'eb-tab-active' : ''}`} onClick={() => setTab('estoque')}>
          <Boxes size={15} /> Estoque
        </button>
        <button className={`eb-tab ${tab === 'historico' ? 'eb-tab-active' : ''}`} onClick={() => setTab('historico')}>
          <History size={15} /> Histórico
        </button>
        <button className={`eb-tab ${tab === 'relatorio' ? 'eb-tab-active' : ''}`} onClick={() => setTab('relatorio')}>
          <FileText size={15} /> Relatório
        </button>
        {isGerente && (
          <button className={`eb-tab ${tab === 'config' ? 'eb-tab-active' : ''}`} onClick={() => setTab('config')}>
            <Settings size={15} /> Configurações
          </button>
        )}
      </nav>

      <main className="eb-main">
        {tab === 'estoque' && (
          <EstoqueTab
            produtos={produtosFiltrados}
            totais={totais}
            busca={busca} setBusca={setBusca}
            filtroCategoria={filtroCategoria} setFiltroCategoria={setFiltroCategoria}
            somenteBaixo={somenteBaixo} setSomenteBaixo={setSomenteBaixo}
            isGerente={isGerente}
            onMovimentar={(produto, tipo) => setModalMov({ produto, tipo })}
            onNovaMovimentacao={() => setModalMov({})}
            onNovoProduto={() => setModalProduto({})}
            onEditarProduto={(p) => setModalProduto({ produto: p })}
          />
        )}
        {tab === 'historico' && <HistoricoTab movimentacoes={movimentacoes} />}
        {tab === 'relatorio' && <RelatorioTab produtos={produtos} totais={totais} role={role} />}
        {tab === 'config' && isGerente && (
          <ConfigTab
            produtos={produtos}
            senhas={senhas}
            onAlterarSenhas={handleAlterarSenhas}
            onNovoProduto={() => setModalProduto({})}
            onEditarProduto={(p) => setModalProduto({ produto: p })}
          />
        )}
      </main>

      {modalMov && (
        <MovimentacaoModal
          produtos={produtos}
          produtoInicial={modalMov.produto || null}
          tipoInicial={modalMov.tipo}
          onClose={() => setModalMov(null)}
          onConfirm={handleConfirmMovimentacao}
        />
      )}

      {modalProduto && (
        <ProdutoModal
          produto={modalProduto.produto || null}
          onClose={() => setModalProduto(null)}
          onSave={handleSaveProduto}
          onDelete={handleDeleteProduto}
        />
      )}

      <Toast toast={toast} />
    </div>
  );
}

        <div className="eb-input-icon-wrap" style={{ flex: 1, minWidth: 220 }}>
          <Search size={15} className="eb-input-icon" />
          <input
            className="eb-input eb-input-icon-padding"
            placeholder="Buscar por nome do item ou descrição…"
            value={busca}
            onChange={(e) => setBusca(e.target.value)}
          />
        </div>
        <div className="eb-chip-group">
          {['Todos', ...CATEGORIAS].map((c) => (
            <button
              key={c}
              className={`eb-chip ${filtroCategoria === c ? 'eb-chip-active' : ''}`}

              {c}

          ))}

          className={`eb-chip ${somenteBaixo ? 'eb-chip-active-alert' : ''}`}

      <div className="eb-table-wrap">
        <table className="eb-table">
          <thead>
            <tr>
              <th style={{ width: 32 }}></th>
              <th>Nome do item</th>
              <th>Descrição</th>
              <th>Categoria</th>
              <th style={{ textAlign: 'right' }}>Quantidade</th>
              {isGerente && <th style={{ textAlign: 'right' }}>Ações</th>}
            </tr>
          </thead>
          <tbody>
            {produtos.map((p) => {
              const baixo = p.quantidade < LIMITE_ESTOQUE_BAIXO;
              return (
                <tr key={p.id}>
                  <td><TileSwatch nomeItem={p.nomeItem} categoria={p.categoria} /></td>
                  <td className="eb-td-nome">
                    {isGerente ? (
                      <button className="eb-link-plain" onClick={() => onEditarProduto(p)}>{p.nomeItem}</button>
                    ) : p.nomeItem}
                  </td>
                  <td className="eb-td-desc">{p.descricao || '—'}</td>
                  <td><CategoriaBadge categoria={p.categoria} /></td>
                  <td className={`eb-td-qtd ${baixo ? 'eb-td-qtd-baixo' : ''}`}>
                    {fmtQtd(p.quantidade)} {UNIDADE}
                    {baixo && <AlertTriangle size={12} style={{ marginLeft: 5, position: 'relative', top: -1 }} />}
                  </td>
                  {isGerente && (
                    <td>
                      <div className="eb-row-actions">
                        <button className="eb-icon-btn-sm eb-icon-btn-entrada" title="Registrar entrada" onClick={() => onMovimentar(p, 'entrada')}><Plus size={14} /></button>
                        <button className="eb-icon-btn-sm eb-icon-btn-saida" title="Registrar saída" onClick={() => onMovimentar(p, 'saida')}><Minus size={14} /></button>
                      </div>
                    </td>
                  )}
                </tr>
              );
            })}
            {produtos.length === 0 && (
              <tr><td colSpan={isGerente ? 6 : 5} className="eb-empty">Nenhum produto encontrado com esse filtro.</td></tr>
            )}
          </tbody>
        </table>
      </div>
    </>
  );
}

    <>
      <div className="eb-toolbar">

/* ---------- Relatório (impressão / PDF) ---------- */

function RelatorioTab({ produtos, totais, role }) {
  const [incluirZerados, setIncluirZerados] = useState(true);
  const agora = fmtData(new Date().toISOString());

  const porCategoria = useMemo(() => {
    return CATEGORIAS.map((categoria) => ({
      categoria,
      itens: produtos
        .filter((p) => p.categoria === categoria)
        .filter((p) => incluirZerados || p.quantidade > 0)
        .sort((a, b) => a.nomeItem.localeCompare(b.nomeItem, 'pt-BR')),
    }));
  }, [produtos, incluirZerados]);

  return (
    <>
      <div className="eb-toolbar eb-no-print">
        <button className="eb-btn-primary" onClick={() => window.print()}>
          <Printer size={14} /> Imprimir / Salvar como PDF
        </button>
        <label className="eb-checkbox-label">
          <input type="checkbox" checked={incluirZerados} onChange={(e) => setIncluirZerados(e.target.checked)} />
          Incluir itens com estoque zerado
        </label>
        <span className="eb-hint-text">
          No diálogo de impressão do navegador, escolha "Salvar como PDF" em destino.
        </span>
      </div>

      <div className="eb-print-area">
        <div className="eb-print-header-block">
          <div className="eb-print-brand">
            <LogoMark size="sm" />
            <div>
              <div className="eb-print-brand-name">{LOJA_NOME}</div>
              <div className="eb-print-brand-sub">Relatório de estoque</div>
            </div>
          </div>
          <div className="eb-print-meta">
            Gerado em {agora} · {role === 'gerente' ? 'Gerente' : 'Visitante'}
          </div>
        </div>

        <table className="eb-print-summary">
          <tbody>
            <tr>
              <td>Total geral</td>
              <td>{fmtQtd(totais.geral)} {UNIDADE}</td>
            </tr>
            {CATEGORIAS.map((c) => (
              <tr key={c}>
                <td>{c}</td>
                <td>{fmtQtd(totais.porCategoria[c] || 0)} {UNIDADE}</td>
              </tr>
            ))}
          </tbody>
        </table>

        {porCategoria.map(({ categoria, itens }) => (
          <div key={categoria} className="eb-print-section">
            <h3 className="eb-print-section-title">{categoria} — {itens.length} itens</h3>
            <table className="eb-print-table">
              <thead>
                <tr>
                  <th>Nome do item</th>
                  <th>Descrição</th>
                  <th style={{ textAlign: 'right' }}>Quantidade</th>
                </tr>
              </thead>
              <tbody>
                {itens.map((p) => (
                  <tr key={p.id}>
                    <td>{p.nomeItem}</td>
                    <td>{p.descricao || '—'}</td>
                    <td style={{ textAlign: 'right' }}>{fmtQtd(p.quantidade)} {UNIDADE}</td>
                  </tr>
                ))}
                {itens.length === 0 && (
                  <tr><td colSpan={3} style={{ color: '#9A9EA4', textAlign: 'center' }}>Nenhum item nesta categoria.</td></tr>
                )}
              </tbody>
            </table>
          </div>
        ))}
      </div>
    </>
  );
}

      /* Tabs */
      .eb-tabs {
        display: flex; gap: 4px;
        background: #FFFFFF;
        border-bottom: 1px solid #DDD9D0;
        padding: 0 16px;
        overflow-x: auto;
      }
      .eb-tab {
        display: flex; align-items: center; gap: 6px;
        padding: 12px 14px;
        font-size: 13.5px; font-weight: 500;
        color: #6B6F76;
        border-bottom: 2px solid transparent;
        white-space: nowrap;
      }
      .eb-tab-active { color: #2B6C86; border-bottom-color: #2B6C86; }

      .eb-main { padding: 18px 20px 60px; max-width: 1180px; margin: 0 auto; }

      /* Stats */
      .eb-stats-strip {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 10px; margin-bottom: 16px;
      }
      .eb-stat {
        background: #FFFFFF; border-top: 3px solid #2B6C86;
        border-radius: 6px; padding: 12px 14px;
        box-shadow: 0 1px 2px rgba(35,38,43,0.06);
      }
      .eb-stat-value {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 20px; font-weight: 500;
      }
      .eb-stat-label { font-size: 11.5px; color: #6B6F76; margin-top: 2px; }

      /* Toolbar */
      .eb-toolbar {
        display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
        margin-bottom: 14px;
      }
      .eb-chip-group { display: flex; gap: 6px; flex-wrap: wrap; }
      .eb-chip {
        font-size: 12.5px; font-weight: 500; color: #6B6F76;
        background: #FFFFFF; border: 1px solid #DDD9D0;
        padding: 7px 12px; border-radius: 999px;
        display: flex; align-items: center; gap: 5px;
        white-space: nowrap;
      }
      .eb-chip-active { background: #23262B; color: #F4F3EF; border-color: #23262B; }
      .eb-chip-active-alert { background: #B5432A; color: #FFF; border-color: #B5432A; }

      /* Inputs */
      .eb-input-icon-wrap { position: relative; display: flex; align-items: center; }
      .eb-input-icon { position: absolute; left: 11px; color: #9A9EA4; pointer-events: none; }
      .eb-input {
        width: 100%;
        font-family: 'IBM Plex Sans', sans-serif;
        font-size: 13.5px;
        border: 1px solid #DDD9D0;
        background: #FFFFFF;
        border-radius: 6px;
        padding: 9px 12px;
        color: #23262B;
      }
      .eb-input:focus { outline: 2px solid #2B6C86; outline-offset: 1px; border-color: #2B6C86; }
      .eb-input-icon-padding { padding-left: 32px; }
      .eb-field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 13px; }
      .eb-field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .eb-field-label { font-size: 12px; font-weight: 500; color: #565A61; }

      /* Buttons */
      .eb-btn-primary {
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        background: #2B6C86; color: #FFFFFF;
        border-radius: 6px; padding: 10px 16px;
        font-size: 13.5px; font-weight: 500;
      }
      .eb-btn-primary:hover { background: #245A70; }
      .eb-btn-ghost {
        background: transparent; color: #565A61;
        border: 1px solid #DDD9D0; border-radius: 6px;
        padding: 10px 16px; font-size: 13.5px; font-weight: 500;
      }
      .eb-btn-danger { background: #B5432A; color: #fff; border-radius: 6px; padding: 8px 14px; font-size: 13px; font-weight: 500; }
      .eb-btn-sm { padding: 7px 12px; font-size: 12.5px; }
      .eb-link-btn { color: #2B6C86; font-size: 12.5px; font-weight: 500; }
      .eb-link-btn-danger { color: #B5432A; font-size: 12.5px; font-weight: 500; display: flex; align-items: center; gap: 5px; }
      .eb-link-plain { color: #23262B; text-align: left; text-decoration: underline; text-decoration-color: #DDD9D0; text-underline-offset: 2px; }

      /* Icon buttons */
      .eb-icon-btn { color: #6B6F76; padding: 6px; border-radius: 6px; }
      .eb-icon-btn:hover { background: #F0EEE9; }
      .eb-icon-btn-light { color: #F4F3EF; }
      .eb-icon-btn-light:hover { background: rgba(255,255,255,0.1); }
      .eb-icon-btn-sm { padding: 6px; border-radius: 5px; border: 1px solid #DDD9D0; background: #FFFFFF; }
      .eb-icon-btn-entrada { color: #4C7A52; }
      .eb-icon-btn-entrada:hover { background: #EAF2EA; border-color: #4C7A52; }
      .eb-icon-btn-saida { color: #B5432A; }
      .eb-icon-btn-saida:hover { background: #F7EAE6; border-color: #B5432A; }
      .eb-row-actions { display: flex; gap: 6px; justify-content: flex-end; }

      /* Table */
      .eb-table-wrap {
        background: #FFFFFF; border-radius: 8px; overflow: auto;
        box-shadow: 0 1px 2px rgba(35,38,43,0.06);
        border: 1px solid #E5E1D8;
      }
      .eb-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 640px; }
      .eb-table th {
        text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;
        color: #8A8E94; font-weight: 600; padding: 10px 12px; border-bottom: 1px solid #E5E1D8;
        background: #FAF9F6; position: sticky; top: 0;
      }
      .eb-table td { padding: 9px 12px; border-bottom: 1px solid #F0EEE9; vertical-align: middle; }
      .eb-table tbody tr:hover { background: #FAFAF8; }
      .eb-td-nome { font-weight: 500; }
      .eb-td-desc { color: #6B6F76; }
      .eb-td-data { color: #6B6F76; font-family: 'IBM Plex Mono', monospace; font-size: 12px; white-space: nowrap; }
      .eb-td-qtd { font-family: 'IBM Plex Mono', monospace; text-align: right; white-space: nowrap; }
      .eb-td-qtd-baixo { color: #B5432A; font-weight: 500; }
      .eb-empty { text-align: center; color: #9A9EA4; padding: 30px; }

      .eb-badge {
        font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 999px;
        display: inline-block; white-space: nowrap;
      }

      .eb-mov-pill {
        display: inline-flex; align-items: center; gap: 4px;
        font-size: 11.5px; font-weight: 500; padding: 3px 9px; border-radius: 999px;
      }
      .eb-mov-entrada { background: #EAF2EA; color: #4C7A52; }
      .eb-mov-saida { background: #F7EAE6; color: #B5432A; }

      /* Modal */
      .eb-modal-backdrop {
        position: fixed; inset: 0; background: rgba(35,38,43,0.55);
        display: flex; align-items: center; justify-content: center;
        padding: 16px; z-index: 50;
      }
      .eb-modal {
        background: #FFFFFF; border-radius: 10px; width: 100%; max-width: 440px;
        max-height: 88vh; display: flex; flex-direction: column;
        box-shadow: 0 12px 32px rgba(35,38,43,0.25);
      }
      .eb-modal-head {
        display: flex; align-items: center; justify-content: space-between;
        padding: 16px 18px; border-bottom: 1px solid #EFEDE7;
      }
      .eb-modal-title { font-family: 'Oswald', sans-serif; font-size: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
      .eb-modal-body { padding: 16px 18px; overflow-y: auto; }
      .eb-modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 18px; border-top: 1px solid #EFEDE7; }

      .eb-produto-selecionado, .eb-config-list-row, .eb-option-row {
        display: flex; align-items: center; gap: 10px;
        border: 1px solid #E5E1D8; border-radius: 6px; padding: 8px 10px;
        width: 100%; text-align: left; background: #FFFFFF;
      }
      .eb-option-row { border: none; border-bottom: 1px solid #F0EEE9; border-radius: 0; padding: 9px 4px; }
      .eb-options-list { margin-top: 6px; max-height: 220px; overflow-y: auto; border: 1px solid #E5E1D8; border-radius: 6px; }
      .eb-produto-nome { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .eb-produto-desc { font-size: 11.5px; color: #8A8E94; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      .eb-toggle-group { display: flex; gap: 8px; }
      .eb-toggle-btn {
        flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
        border: 1px solid #DDD9D0; border-radius: 6px; padding: 9px; font-size: 13px; font-weight: 500;
        color: #6B6F76; background: #FFFFFF;
      }
      .eb-toggle-active-entrada { border-color: #4C7A52; color: #4C7A52; background: #EAF2EA; }
      .eb-toggle-active-saida { border-color: #B5432A; color: #B5432A; background: #F7EAE6; }
      .eb-toggle-active-cat { font-weight: 600; }

      .eb-error-text { color: #B5432A; font-size: 12.5px; margin-top: 4px; }
      .eb-ok-text { color: #4C7A52; font-size: 12.5px; margin-top: 4px; }

      /* Config */
      .eb-config-grid { display: grid; gap: 16px; grid-template-columns: minmax(260px, 380px) 1fr; align-items: start; }
      @media (max-width: 780px) { .eb-config-grid { grid-template-columns: 1fr; } .eb-field-row { grid-template-columns: 1fr; } }
      .eb-card { background: #FFFFFF; border: 1px solid #E5E1D8; border-radius: 8px; padding: 18px; }
      .eb-card-title { font-family: 'Oswald', sans-serif; font-size: 14px; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 14px; }
      .eb-card-head-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
      .eb-card-head-row .eb-card-title { margin-bottom: 0; }
      .eb-config-list { display: flex; flex-direction: column; gap: 6px; max-height: 480px; overflow-y: auto; }
      .eb-config-list-row:hover { background: #FAFAF8; }
      .eb-danger-zone { margin-top: 4px; padding-top: 12px; border-top: 1px dashed #E5E1D8; }
      .eb-confirm-delete { display: flex; flex-direction: column; gap: 8px; font-size: 12.5px; color: #565A61; }

      /* Login */
      .eb-login-wrap { display: flex; align-items: center; justify-content: center; padding: 20px; }
      .eb-login-card {
        background: #FFFFFF; border-radius: 12px; padding: 32px 28px; width: 100%; max-width: 360px;
        box-shadow: 0 8px 28px rgba(35,38,43,0.10); border: 1px solid #E5E1D8; text-align: center;
      }
      .eb-login-mark {
        width: 44px; height: 44px; border-radius: 10px; background: #23262B; color: #F4F3EF;
        display: flex; align-items: center; justify-content: center; margin: 0 auto 14px;
      }

      /* Zagonel brand mark */
      .zg-mark {
        background: linear-gradient(160deg, #4FC15A 0%, #1E8A3C 100%);
        display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      }
      .zg-mark-sm { width: 34px; height: 34px; border-radius: 8px; }
      .zg-home-icon { color: #FFFFFF; }
      .zg-mark-lg {
        width: 84px; height: 84px; border-radius: 18px; padding: 9px;
        margin: 0 auto 14px;
      }
      .zg-ribbon {
        width: 100%; height: 100%; background: #FFFFFF;
        clip-path: polygon(50% 0%, 100% 28%, 100% 100%, 0% 100%, 0% 28%);
        display: flex; align-items: flex-end; justify-content: center;
        padding-bottom: 11px;
      }
      .zg-word {
        font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 12.5px;
        letter-spacing: 0.01em; line-height: 1;
        background: linear-gradient(180deg, #F5A83B 0%, #DE5A2A 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }

      .eb-login-title { font-family: 'Oswald', sans-serif; font-size: 20px; text-transform: uppercase; letter-spacing: 0.03em; font-weight: 600; }
      .eb-login-sub { font-size: 12.5px; color: #8A8E94; margin-top: 4px; margin-bottom: 22px; }
      .eb-login-form { text-align: left; }
      .eb-login-hint { font-size: 11.5px; color: #9A9EA4; text-align: center; margin-top: 14px; }
      .eb-login-loading { display: flex; align-items: center; justify-content: center; gap: 8px; color: #6B6F76; font-size: 13px; padding: 20px 0; }

      /* Toast */
      .eb-toast {
        position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
        padding: 11px 18px; border-radius: 8px; font-size: 13px; font-weight: 500;
        box-shadow: 0 6px 20px rgba(35,38,43,0.2); z-index: 60; max-width: 90vw;
      }
      .eb-toast-ok { background: #23262B; color: #F4F3EF; }
      .eb-toast-error { background: #B5432A; color: #FFF; }

      /* Extras: checkbox / hint */
      .eb-checkbox-label {
        display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: #565A61;
      }
      .eb-checkbox-label input { width: 15px; height: 15px; accent-color: #2B6C86; }
      .eb-hint-text { font-size: 11.5px; color: #9A9EA4; }

      /* Relatório / impressão */
      .eb-print-area { display: none; }
      .eb-print-header-block {
        display: flex; align-items: center; justify-content: space-between;
        border-bottom: 2px solid #23262B; padding-bottom: 12px; margin-bottom: 16px;
      }
      .eb-print-brand { display: flex; align-items: center; gap: 10px; }
      .eb-print-brand-name { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 16px; text-transform: uppercase; letter-spacing: 0.02em; }
      .eb-print-brand-sub { font-size: 11px; color: #6B6F76; }
      .eb-print-meta { font-size: 11px; color: #6B6F76; font-family: 'IBM Plex Mono', monospace; }
      .eb-print-summary {
        width: 100%; margin-bottom: 22px; border-collapse: collapse; font-size: 13px;
      }
      .eb-print-summary td { padding: 5px 0; border-bottom: 1px solid #E5E1D8; }
      .eb-print-summary td:last-child { text-align: right; font-family: 'IBM Plex Mono', monospace; font-weight: 500; }
      .eb-print-section { margin-bottom: 20px; }
      .eb-print-section-title {
        font-family: 'Oswald', sans-serif; font-size: 13px; text-transform: uppercase;
        letter-spacing: 0.03em; color: #2B6C86; border-bottom: 1px solid #DDD9D0;
        padding-bottom: 4px; margin-bottom: 6px;
      }
      .eb-print-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
      .eb-print-table th {
        text-align: left; font-size: 10px; text-transform: uppercase; color: #8A8E94;
        padding: 4px 6px; border-bottom: 1px solid #23262B;
      }
      .eb-print-table td { padding: 4px 6px; border-bottom: 1px solid #EFEDE7; }

      @media print {
        @page { margin: 14mm; }
        body * { visibility: hidden; }
        .eb-print-area, .eb-print-area * { visibility: visible; }
        .eb-print-area { display: block !important; position: absolute; left: 0; top: 0; width: 100%; }
        .eb-print-section { page-break-inside: avoid; }
        .eb-no-print { display: none !important; }
      }
    `}</style>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<EstoqueApp />);
</script>
